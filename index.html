/* ═════════ CHART ENGINE ═════════ */
const CW=760, PAD={l:118,r:58,t:14,b:26};

/* horizontal bar chart */
function hbar(rows,opt={}){
 const max=opt.max||Math.max(...rows.map(r=>r[1]||0))*1.15;
 const bh=opt.bh||26, gap=8, h=PAD.t+rows.length*(bh+gap)+PAD.b;
 const W=CW-PAD.l-PAD.r;
 let s=`<svg viewBox="0 0 ${CW} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 /* gridlines */
 const step=opt.step||1;
 for(let v=0;v<=max;v+=step){const x=PAD.l+(v/max)*W;
  s+=`<line x1="${x}" y1="${PAD.t-4}" x2="${x}" y2="${h-PAD.b+2}" stroke="#e4e2dc" stroke-width="1"/>`;
  s+=`<text x="${x}" y="${h-PAD.b+16}" font-size="9" fill="#9b968a" text-anchor="middle">${v}${opt.unit||'%'}</text>`;}
 rows.forEach((r,i)=>{
  const y=PAD.t+i*(bh+gap), val=r[1], col=r[3]||'#8a6a1c';
  s+=`<text x="${PAD.l-9}" y="${y+bh/2+4}" font-size="11" fill="#1c1b18" text-anchor="end" font-weight="600">${r[0]}</text>`;
  if(val===null||val===undefined){
   s+=`<rect x="${PAD.l}" y="${y}" width="${W}" height="${bh}" fill="#f6f6f3" stroke="#e4e2dc" stroke-dasharray="3 3"/>`;
   s+=`<text x="${PAD.l+10}" y="${y+bh/2+4}" font-size="9.5" fill="#9b968a" letter-spacing="1">GAP — NOT VERIFIED</text>`;
  }else{
   const w=Math.max(2,(val/max)*W);
   s+=`<rect x="${PAD.l}" y="${y}" width="${w}" height="${bh}" fill="${col}" rx="2"/>`;
   s+=`<text x="${PAD.l+w+7}" y="${y+bh/2+4}" font-size="11.5" fill="${col}" font-weight="600">${val.toFixed(2)}${opt.unit||'%'}</text>`;
   if(r[2])s+=`<text x="${PAD.l+6}" y="${y+bh/2+4}" font-size="9" fill="#fff" opacity=".9">${r[2]}</text>`;
  }});
 return s+`</svg>`;
}

/* grouped bars: two series per country */
function gbar(rows,opt={}){
 const max=opt.max||Math.max(...rows.flatMap(r=>[r[1]||0,r[2]||0]))*1.15;
 const bh=13, gap=14, h=PAD.t+rows.length*(bh*2+gap)+PAD.b+14;
 const W=CW-PAD.l-PAD.r;
 let s=`<svg viewBox="0 0 ${CW} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 const step=opt.step||1;
 for(let v=0;v<=max;v+=step){const x=PAD.l+(v/max)*W;
  s+=`<line x1="${x}" y1="${PAD.t-4}" x2="${x}" y2="${h-PAD.b-6}" stroke="#e4e2dc"/>`;
  s+=`<text x="${x}" y="${h-PAD.b+8}" font-size="9" fill="#9b968a" text-anchor="middle">${v}%</text>`;}
 rows.forEach((r,i)=>{
  const y=PAD.t+i*(bh*2+gap);
  s+=`<text x="${PAD.l-9}" y="${y+bh+3}" font-size="11" fill="#1c1b18" text-anchor="end" font-weight="600">${r[0]}</text>`;
  [[r[1],opt.c1||'#2c5680',y],[r[2],opt.c2||'#c9a227',y+bh]].forEach(([v,c,yy])=>{
   if(v===null||v===undefined){s+=`<rect x="${PAD.l}" y="${yy}" width="46" height="${bh-1}" fill="#f6f6f3" stroke="#e4e2dc" stroke-dasharray="2 2"/>
    <text x="${PAD.l+51}" y="${yy+bh-3}" font-size="8.5" fill="#9b968a">GAP</text>`;}
   else{const w=Math.max(2,(v/max)*W);
    s+=`<rect x="${PAD.l}" y="${yy}" width="${w}" height="${bh-1}" fill="${c}" rx="1.5"/>
    <text x="${PAD.l+w+6}" y="${yy+bh-3}" font-size="10" fill="${c}" font-weight="600">${v.toFixed(2)}</text>`;}});
 });
 s+=`<rect x="${PAD.l}" y="${h-14}" width="9" height="9" fill="${opt.c1||'#2c5680'}" rx="1"/>
 <text x="${PAD.l+13}" y="${h-6}" font-size="9.5" fill="#6e6a60">${opt.l1}</text>
 <rect x="${PAD.l+120}" y="${h-14}" width="9" height="9" fill="${opt.c2||'#c9a227'}" rx="1"/>
 <text x="${PAD.l+133}" y="${h-6}" font-size="9.5" fill="#6e6a60">${opt.l2}</text>`;
 return s+`</svg>`;
}

/* diverging bar for real yields (can be negative) */
function dbar(rows){
 const vals=rows.map(r=>r[1]).filter(v=>v!==null);
 const mx=Math.max(...vals.map(Math.abs))*1.3||1;
 const bh=26,gap=8,h=PAD.t+rows.length*(bh+gap)+PAD.b, W=CW-PAD.l-PAD.r, zero=PAD.l+W*(mx/(mx*2));
 let s=`<svg viewBox="0 0 ${CW} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 s+=`<line x1="${zero}" y1="${PAD.t-4}" x2="${zero}" y2="${h-PAD.b+2}" stroke="#6e6a60" stroke-width="1.5"/>`;
 s+=`<text x="${zero}" y="${h-PAD.b+16}" font-size="9" fill="#6e6a60" text-anchor="middle">0%</text>`;
 rows.forEach((r,i)=>{
  const y=PAD.t+i*(bh+gap),v=r[1];
  s+=`<text x="${PAD.l-9}" y="${y+bh/2+4}" font-size="11" fill="#1c1b18" text-anchor="end" font-weight="600">${r[0]}</text>`;
  if(v===null){s+=`<text x="${zero+8}" y="${y+bh/2+4}" font-size="9.5" fill="#9b968a" letter-spacing="1">GAP — INFLATION NOT VERIFIED</text>`;}
  else{const w=Math.abs(v)/(mx*2)*W, col=v>=0?'#1d6b4c':'#9b2f2f';
   s+=`<rect x="${v>=0?zero:zero-w}" y="${y}" width="${w}" height="${bh}" fill="${col}" rx="2"/>
   <text x="${v>=0?zero+w+7:zero-w-7}" y="${y+bh/2+4}" font-size="11.5" fill="${col}" font-weight="600" text-anchor="${v>=0?'start':'end'}">${v>0?'+':''}${v.toFixed(2)}%</text>`;}
 });
 return s+`</svg>`;
}

/* sparkline path for a series */
function spark(vals,w=200,h=42,col='#8a6a1c'){
 const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
 const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-mn)/rg)*(h-6)-3}`);
 return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
 <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
 <circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="2.8" fill="${col}"/></svg>`;
}

const chg=(now,then)=>(now===null||then===null)?null:+(now-then).toFixed(2);

/* comparison matrix: difference in 10y between every pair */
function matrix(rows){
 const n=rows.length, cell=74, lab=104, h=lab+n*cell+6, w=lab+n*cell+6;
 let s=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono,monospace">`;
 rows.forEach((c,i)=>{
  s+=`<text x="${lab-8}" y="${lab+i*cell+cell/2+4}" font-size="10.5" fill="#1c1b18" text-anchor="end" font-weight="600">${c.fl}</text>`;
  s+=`<text x="${lab+i*cell+cell/2}" y="${lab-9}" font-size="10.5" fill="#1c1b18" text-anchor="middle" font-weight="600">${c.fl}</text>`;});
 rows.forEach((a,i)=>rows.forEach((b,j)=>{
  const x=lab+j*cell, y=lab+i*cell;
  if(i===j){s+=`<rect x="${x}" y="${y}" width="${cell-2}" height="${cell-2}" fill="#f0eee8"/>`;return;}
  const d=chg(a.y10,b.y10);
  if(d===null){s+=`<rect x="${x}" y="${y}" width="${cell-2}" height="${cell-2}" fill="#f6f6f3" stroke="#e4e2dc" stroke-dasharray="2 2"/>
   <text x="${x+cell/2}" y="${y+cell/2+4}" font-size="9" fill="#9b968a" text-anchor="middle">GAP</text>`;return;}
  const alpha=Math.min(1,Math.abs(d)/2.5);
  const col=d>0?`rgba(155,47,47,${0.10+alpha*0.55})`:`rgba(44,86,128,${0.10+alpha*0.55})`;
  s+=`<rect x="${x}" y="${y}" width="${cell-2}" height="${cell-2}" fill="${col}"/>
  <text x="${x+cell/2}" y="${y+cell/2+4}" font-size="11.5" fill="${Math.abs(d)>1.4?'#fff':'#1c1b18'}" text-anchor="middle" font-weight="600">${d>0?'+':''}${d.toFixed(2)}</text>`;}));
 return s+`</svg>`;
}
