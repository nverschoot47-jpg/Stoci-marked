<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f6f3;--panel:#ffffff;--p2:#fafaf8;--bd:#e4e4dd;--b2:#d0d0c6;
  --acc:#8a6a1c;--acc2:#6f5516;--pos:#1d6b4c;--neg:#9b2f2f;--inf:#2c5680;
  --tx:#1c2026;--tx2:#5a636e;--mu:#949aa3;
}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:5px;border:2px solid var(--bg)}
a{color:var(--inf);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-weight:600}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:52px;background:var(--panel);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:600;gap:14px}
.logo{font-family:"IBM Plex Mono";font-size:14px;font-weight:600;letter-spacing:2.5px;color:var(--tx);white-space:nowrap}
.logo span{color:var(--mu);font-weight:400;font-size:9px;margin-left:10px;letter-spacing:1.5px}
.hright{font-family:"IBM Plex Mono";font-size:8px;color:var(--mu);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hbadge{padding:3px 8px;border:1px solid var(--bd);border-radius:3px;font-family:"IBM Plex Mono";font-size:8px;color:var(--tx2);white-space:nowrap;background:var(--p2)}
.hbadge b{color:var(--acc);font-weight:600}
.hbadge.stale{border-color:#e8cfcf;background:#fdf6f6;color:#8c4a4a}
.hbadge.fresh{border-color:#c9e2d5;background:#f4faf7;color:var(--pos)}

.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);padding:0 16px;position:sticky;top:52px;z-index:599;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.tab{padding:11px 15px;font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:1.3px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;transition:all .12s;user-select:none}
.tab:hover{color:var(--tx);background:var(--p2)}
.tab.on{color:var(--acc2);border-color:var(--acc)}
.tab i{font-style:normal;color:var(--mu);margin-right:6px}
.tab.on i{color:var(--acc)}

.panel{display:none}.panel.act{display:block}
.w{max-width:1760px;margin:0 auto;padding:16px 22px 70px}
.sh{font-family:"IBM Plex Mono";font-size:8px;letter-spacing:2px;color:var(--tx2);display:flex;align-items:center;gap:10px;margin:26px 0 10px;text-transform:uppercase}
.sh:first-child{margin-top:6px}
.sh b{color:var(--acc2);font-weight:600}
.sh::after{content:"";flex:1;height:1px;background:var(--bd)}
.lede{color:var(--tx2);font-size:12.5px;max-width:1080px;margin-bottom:14px;line-height:1.65}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1400px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--bd);border-radius:5px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,25,35,.03)}
.card.hl{border-color:var(--acc);box-shadow:0 0 0 2px rgba(138,106,28,.08)}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:9px;margin-bottom:11px}
.ctl{font-family:"IBM Plex Mono";font-size:16px;font-weight:600;letter-spacing:.5px;color:var(--tx)}
.ctl small{display:block;font-size:9px;letter-spacing:.8px;color:var(--mu);font-weight:400;margin-top:3px;text-transform:none}
.ctr{font-family:"IBM Plex Mono";font-size:16px;font-weight:600;text-align:right}
.ctr small{display:block;font-size:9.5px;font-weight:500;margin-top:2px}
.desk{font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:2px;color:var(--mu);text-transform:uppercase}

.s{font-family:"IBM Plex Mono";font-size:7px;letter-spacing:.5px;padding:1px 4px;border-radius:3px;border:1px solid;vertical-align:middle;margin-left:4px;white-space:nowrap;cursor:help}
.s-co{color:#1d6b4c;border-color:#c9e2d5;background:#f4faf7}
.s-f4{color:#8a6a1c;border-color:#e6dcc0;background:#fbf8ef}
.s-ct{color:#2c5680;border-color:#ccdae8;background:#f5f8fc}
.s-an{color:#9b2f2f;border-color:#e8cfcf;background:#fdf6f6}
.s-fe{color:var(--tx2);border-color:var(--bd);background:var(--p2)}
.s-pf{color:#6b4a9c;border-color:#dbd0ea;background:#faf7fd}
.s-de{color:var(--mu);border-color:var(--bd);background:var(--p2)}

.tag{display:inline-block;font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:.6px;padding:2px 6px;border-radius:3px;border:1px solid var(--bd);background:var(--p2);color:var(--tx2);margin:1px 3px 1px 0;cursor:pointer;white-space:nowrap}
.tag:hover{border-color:var(--acc);color:var(--acc2)}
.tag.pos{color:var(--pos);border-color:#c9e2d5;background:#f4faf7}
.tag.neg{color:var(--neg);border-color:#e8cfcf;background:#fdf6f6}
.tag.gold{color:var(--acc2);border-color:#e6dcc0;background:#fbf8ef}
.tag.inf{color:var(--inf);border-color:#ccdae8;background:#f5f8fc}
.tag.st{cursor:default}

.blk{border-left:3px solid var(--b2);padding:7px 0 7px 11px;margin:9px 0;font-size:12px}
.blk .h{font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:1.4px;color:var(--mu);text-transform:uppercase;margin-bottom:3px}
.blk.p{border-color:#7fb59a}.blk.p .h{color:var(--pos)}
.blk.n{border-color:#cf9a9a}.blk.n .h{color:var(--neg)}
.blk.g{border-color:#d3bd7e}.blk.g .h{color:var(--acc2)}
.blk.i{border-color:#93b0cc}.blk.i .h{color:var(--inf)}
.mech{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:4px;padding:9px 11px;margin:9px 0;line-height:1.7}
.mech .up{color:var(--pos);font-weight:600}.mech .dn{color:var(--neg);font-weight:600}.mech .ar{color:var(--mu);margin:0 4px}
.sign{font-family:"IBM Plex Mono";font-weight:700;padding:0 4px;border-radius:3px}
.sign.plus{color:var(--pos);background:#eaf5ef}
.sign.min{color:var(--neg);background:#fbeded}

.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:5px;margin-bottom:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--p2);padding:8px 11px;font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);white-space:nowrap;border-bottom:1px solid var(--b2);font-weight:600;text-align:left;user-select:none;position:sticky;top:0}
thead th.srt{cursor:pointer}thead th.srt:hover{color:var(--acc2)}
tbody tr{border-bottom:1px solid var(--bd)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fbfaf6}
td{padding:8px 11px;vertical-align:top;font-size:11.5px}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono"}
.mono{font-family:"IBM Plex Mono"}
.pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--acc2)}.inf{color:var(--inf)}.mu{color:var(--mu)}.tx2{color:var(--tx2)}
.wrap td{white-space:normal}

.lv{border:1px solid var(--bd);border-radius:4px;margin:8px 0;overflow:hidden}
.lvh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--p2);font-family:"IBM Plex Mono";font-size:11px}
.lvh .t{font-weight:600}
.lvq{display:grid;grid-template-columns:104px 1fr;gap:0}
.lvq>div{padding:5px 10px;border-top:1px solid var(--bd);font-size:11px}
.lvq>div:nth-child(odd){font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:1px;color:var(--mu);text-transform:uppercase;background:var(--p2)}
.q{font-family:"IBM Plex Mono";font-size:7.5px;padding:2px 6px;border-radius:3px;letter-spacing:.7px}

.cone .b{background:#f4faf7;color:var(--pos);text-align:right}

.cone .r{background:#fdf6f6;color:var(--neg)}

.hm td,.hm th{padding:5px 8px;font-size:10.5px;text-align:center;border:1px solid var(--bd)}

.c2{background:#e2f0e8;color:#1a5a3e}
.c1{background:#f0f7f3;color:#2c6b50}

.cm1{background:#fbf0f0;color:#8a4444}
.cm2{background:#f6dede;color:#8a3535}
.cm3{background:#efc9c9;color:#7a2626}

.meter{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%}
.bar{display:flex;height:20px;border-radius:4px;overflow:hidden;border:1px solid var(--bd);margin:8px 0}
.bar div{font-family:"IBM Plex Mono";font-size:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap}

.tl{border-left:2px solid var(--bd);margin-left:92px;padding-left:0}
.tli{display:grid;grid-template-columns:1fr;position:relative;padding:11px 0 11px 20px;border-bottom:1px solid var(--bd)}
.tli::before{content:"";position:absolute;left:-6px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--b2);border:2px solid var(--bg)}
.tli.hi::before{background:var(--acc);box-shadow:0 0 0 3px rgba(138,106,28,.12)}
.tli.done::before{background:var(--bd)}
.tld{position:absolute;left:-112px;width:92px;text-align:right;font-family:"IBM Plex Mono";font-size:9.5px;color:var(--acc2);top:11px}
.tld small{display:block;font-size:7px;color:var(--mu);letter-spacing:.8px}
.tli.done .tld{color:var(--mu)}
.tlt{font-size:12.5px;font-weight:600}
.tlb{color:var(--tx2);font-size:11.5px;margin-top:4px;max-width:1000px}
.act-rule{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--acc2);background:#fbf8ef;border:1px solid #ece3cd;border-radius:4px;padding:5px 9px;margin-top:6px;display:inline-block}

.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inp{background:var(--panel);border:1px solid var(--b2);color:var(--tx);padding:6px 12px;font-family:"IBM Plex Mono";font-size:10px;border-radius:4px;outline:none;width:230px}
.inp:focus{border-color:var(--acc)}.inp::placeholder{color:var(--mu)}
.btn{padding:5px 12px;font-family:"IBM Plex Mono";font-size:8.5px;font-weight:600;border:1px solid var(--b2);border-radius:4px;cursor:pointer;background:var(--panel);color:var(--tx2);letter-spacing:.5px}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.act{border-color:var(--acc);color:#fff;background:var(--acc)}
.note{font-size:10.5px;color:var(--mu);margin-top:8px;font-style:italic}
.warn{border:1px solid #e0c5c5;background:#fdf7f7;border-radius:5px;padding:11px 14px;margin:12px 0;font-size:12px}
.warn .h{font-family:"IBM Plex Mono";font-size:8px;letter-spacing:1.4px;color:var(--neg);text-transform:uppercase;margin-bottom:5px}
.ok{border-color:#c9e2d5;background:#f6fbf8}
.ok .h{color:var(--pos)}
.goldbox{border-color:#e6dcc0;background:#fdfbf4}
.goldbox .h{color:var(--acc2)}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sbc{font-family:"IBM Plex Mono";font-size:9px;color:var(--tx2);background:var(--panel);border:1px solid var(--bd);border-radius:4px;padding:4px 9px}
.sbc b{color:var(--acc2)}
kbd{font-family:"IBM Plex Mono";font-size:9px;border:1px solid var(--b2);border-radius:3px;padding:0 5px;color:var(--tx2)}
</style>
</head>

        ["Remember the sign","Under the corrected mechanism, a strong economy is bad for gold and cheap oil is good for it. That inversion is what the earlier editions of the source document had backwards.","n"]]},
{id:"de", t:"1C · GERMANY & THE EUROZONE", sub:"why the DAX made records during a crash",
 simple:"The German index kept setting records while US technology shares fell. Not because Germany is doing better, but because of what is inside the index.",

 body:[
  "<b>The mechanism is composition, not economics.</b> The German index holds almost no semiconductor weight and a lot of energy, mining, banking and defensive companies. So the chip collapse passed straight through it.",
  "<b>The second engine is input costs.</b> Cheaper oil lowers what German industry pays for energy. Add a flat, predictable US tariff of 10–12.5% instead of the feared 20–46%, and you have most of the explanation for records during a US correction.",
  "<b>What holds it back.</b> The joint currency intervention made the euro stronger, and a stronger euro makes German exports more expensive. That is why cheap oil did not translate fully into the index."],

{id:"uk", t:"1D · UNITED KINGDOM", sub:"the only position that loses on good news",

 kpi:[["FTSE 100","10,917 (4 Aug) · 10,849 (12 Aug)","fe"],["July","best month since February, +4.5%","fe"],["Energy in July","+15%","fe"],["UK inflation (22 Jul)","2.6%, softer","ct"]],
 body:[
  "<b>The July rally was built on a price that no longer exists.</b> Four all-time highs between 29 and 31 July, driven by energy and mining money buying an oil price that has since moved a long way. On 4 August the index gained 0.30% on a day oil fell 5.69%. The engine is being switched off in slow motion and the index has not repriced.",

{id:"cmd", t:"1E · COMMODITIES", sub:"oil, gold, silver — and who actually holds them",

 kpi:[["WTI oil","$75.77 (4 Aug) → ~$82.72 (12 Aug)","fe"],["Brent oil","~$89.26 (12 Aug)","fe"],["Gold","4,152.6 (4 Aug) → $4,430–4,470 (12 Aug)","fe"],
      ["Silver","60.245 · best performer on the board on 4 Aug","fe"],["Gold/silver ratio","70.88 → ~69","de"],
      ["Gold futures positioning","124,831 contracts (21 Jul) — light","ct"],["Silver positioning","11,282 contracts — extremely light","ct"],
      ["Central banks Q2","+289 tonnes bought","ct"],["Gold ETFs Q2","−45 tonnes sold","ct"]],
 body:[
  "<b>Oil is the driver, not the outcome.</b> From $100 on 24 July to $75.77 on 4 August is a 24% round trip in eleven days — and it has since rebounded to around $83. The important pattern is the asymmetry: in the first closure of the Strait, Brent ran from $72 to $118. In the July escalation it stopped at $100. The market prices escalation more cheaply each time, and de-escalation just as violently.",
  "<b>Who actually holds gold</b> beats any chart pattern. Central banks bought 289 tonnes in the second quarter while exchange-traded funds sold 45 tonnes. That is a six-to-one physical bid. Central banks are price-insensitive and policy-driven; the sellers are Western financial investors leaving. That asymmetry is the floor under the market, and it is a far better explanation than any line on a chart.",
  "<b>Silver has two legs</b> that do not always move together. The monetary leg follows gold — interest rates and the dollar. The industrial leg follows technology spending, through electronics and solar panels, against a structural shortage of 46.3 million ounces. On 4 August both pulled the same way: silver rose 4.13% on a risk-on day. That was the industrial leg working, which means a disappointing NVIDIA result on 26 August has a silver channel almost nobody prices.",
  "<b>Positioning is light on both sides.</b> Light positioning cuts both ways: less forced selling if prices fall, but also less fuel from short-covering in a rally. It is why silver can move 4% in a session without any news."],

 <line x1="${L}" y1="${T-6}" x2="${L}" y2="${B}" stroke="#dcdcd4"/><line x1="${L}" y1="${B}" x2="${W-10}" y2="${B}" stroke="#dcdcd4"/>

 <path d="${path}L${sx(8)},${B}L${sx(0)},${B}Z" fill="url(#g${s.id})"/><path d="${path}" fill="none" stroke="${s.col}" stroke-width="2"/>
 <line x1="${lx}" y1="${T-6}" x2="${lx}" y2="${B}" stroke="#949aa3" stroke-dasharray="2 3"/>

 <text x="${W-14}" y="${br+12}" text-anchor="end" fill="#9b2f2f" font-family="IBM Plex Mono" font-size="9">${nf(s.bear,0)} bear</text>

function buildLinks(){
 const t=(document.getElementById("tkin").value||"").trim().toUpperCase();
 if(!t){document.getElementById("lnks").innerHTML=`<div class="note">Type a ticker first.</div>`;return;}
 document.getElementById("lnks").innerHTML=`
 <div class="tw"><table><tbody>
 ${EDGAR.map(e=>`<tr class="wrap"><td style="width:280px"><a href="${e.u.replace('{T}',encodeURIComponent(t))}" target="_blank" rel="noopener"><b>${e.t} →</b></a></td>
 <td class="tx2">${e.n}</td></tr>`).join("")}
 </tbody></table></div>
 <div class="blk g"><div class="h">Then ask, in this order</div>
 1 · Is there a code P in the last 150 days?<br>
 2 · Who was it, and how much relative to what they already held?<br>
 3 · Does the footnote mention a pre-arranged plan? If yes, it does not count.<br>
 4 · Did anyone else buy within 30 days of them?<br>
 5 · Does a policy measure on your map touch this sector?<br>
 6 · And the one that takes real work: what does <b>${t}</b> have that its direct competitors do not?</div>`;
}
function parseRows(){
 const raw=(document.getElementById("paste").value||"").trim();
 if(!raw){document.getElementById("pout").innerHTML=`<div class="note">Nothing pasted yet.</div>`;return;}
 const lines=raw.split(/\n+/).filter(l=>l.trim().length>3);
 const rows=lines.map(l=>{
  const plan=/10b5-?1|rule 10b5|pre-?arranged|trading plan/i.test(l);
  let code="?";
  if(/\bP\b|purchase|bought|open[- ]market buy/i.test(l))code="P";
  if(/\bS\b|sale|sold|disposed/i.test(l))code="S";
  if(/\bA\b|award|grant|vest(ed|ing)?\b|restricted stock unit|RSU/i.test(l))code="A";
  if(/\bF\b|withheld|withholding|tax/i.test(l))code="F";
  if(/\bM\b|option exercise|exercised/i.test(l))code="M";
  if(code=="P"&&/award|grant|RSU/i.test(l))code="A";
  const STOP=/^(P|S|A|F|M|CEO|CFO|COO|CTO|CMO|EVP|SVP|VP|RSU|USD|INC|CORP|LLC|LTD|THE|AND|FOR|NYSE|NASDAQ|SEC|US|UK|EU)$/;
  const cands=(l.match(/\b[A-Z]{1,5}\b/g)||[]).filter(x=>!STOP.test(x));
  const tk=cands.length?cands[0]:"?";
  const val=(l.match(/\$\s?[\d.,]+(?:\s?[MmKk])?/g)||[]).pop()||"—";
  const date=(l.match(/\d{4}-\d{2}-\d{2}|\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/)||["—"])[0];
  const role=/(CEO|chief executive)/i.test(l)?"CEO":/(CFO|chief financial)/i.test(l)?"CFO":
   /(10%|ten percent)/i.test(l)?"10% owner":/director|board/i.test(l)?"Director":
   /(COO|CTO|CMO|EVP|officer|president)/i.test(l)?"Officer":"—";
  return {raw:l.trim(),tk,date,code,val,plan,role};});
 const buys=rows.filter(r=>r.code=="P"&&!r.plan);
 const sells=rows.filter(r=>r.code=="S"&&!r.plan);
 const noise=rows.filter(r=>["A","F","M","?"].includes(r.code)||(r.code=="S"&&r.plan)||(r.code=="P"&&r.plan));
 const byTk={};buys.forEach(b=>{(byTk[b.tk]=byTk[b.tk]||[]).push(b)});
 const clusters=Object.keys(byTk).filter(k=>byTk[k].length>1);
 const tbl=(list,title,cls,note)=>list.length?`
  <div class="sh"><b>${title}</b> · ${list.length}</div><div class="lede">${note}</div>
  <div class="tw"><table><thead><tr><th>Ticker</th><th>Date</th><th>Code</th><th>Role</th><th class="n">Value</th><th>Plan</th><th style="min-width:380px">Original line</th></tr></thead><tbody>
  ${list.map(r=>`<tr class="wrap"><td><b class="${cls}">${r.tk}</b>${clusters.includes(r.tk)&&r.code=="P"?' <span class="tag st pos">CLUSTER</span>':''}</td>
   <td class="mono">${r.date}</td><td><b class="mono ${r.code=="P"?'pos':r.code=="S"?'neg':'mu'}">${r.code}</b></td>
   <td class="tx2">${r.role}</td><td class="n mono">${r.val}</td>
   <td>${r.plan?'<span class="tag st neg">SCHEDULED</span>':'<span class="tag st">—</span>'}</td>
   <td class="mu" style="font-size:10px">${r.raw.slice(0,150)}</td></tr>`).join("")}
  </tbody></table></div>`:"";
 document.getElementById("pout").innerHTML=`
 <div class="sb" style="margin-bottom:10px">
  <span class="sbc">Lines read <b>${rows.length}</b></span>
  <span class="sbc">Open-market purchases <b>${buys.length}</b></span>
  <span class="sbc">Clusters <b>${clusters.length}</b></span>
  <span class="sbc">Sales <b>${sells.length}</b></span>
  <span class="sbc">Discarded as noise <b>${noise.length}</b></span>
 </div>
 ${clusters.length?`<div class="warn ok"><div class="h">Cluster found</div>Two or more different insiders bought in: <b>${clusters.join(", ")}</b>. This is the strongest pattern available and it is rare — two out of 149 large companies had one last quarter. Go straight to gate 5 on these.</div>`:''}
 ${tbl(buys,"KEEP — open-market purchases","pos","These are the only rows that carry a buy signal. Now score them and check the policy map.")}
 ${tbl(sells,"CHECK — sales","neg","Only meaningful if no pre-arranged plan is disclosed. Read the footnote before drawing any conclusion.")}
 ${tbl(noise,"DISCARDED — awards, tax withholdings, scheduled sales","mu","These look like activity and contain none. This is usually the largest group, and discarding it is the entire point of the exercise.")}
 <div class="note">The sorting is based on what appears in the text you pasted. If a line does not state its transaction code clearly, it lands in the discarded group — check those manually rather than assuming they were empty.</div>`;
}

  <td><b>${s.tk}</b></td><td class="n mono gold"><b>${s.px}</b></td><td class="n mono">${s.q}</td>

function calcSold(){
 const rows=[...document.querySelectorAll("#soldbody tr")];
 let net=0, done=0;
 rows.forEach(r=>{
  const tk=r.dataset.tk, s=SOLDTRACK.find(x=>x.tk==tk);
  const now=parseFloat((r.children[3].textContent||"").replace(",","."));
  const dc=r.querySelector(".diff"), tc=r.querySelector(".tot");
  if(!now||isNaN(now)){dc.textContent="—";tc.textContent="—";return;}
  const pct=(now-s.px)/s.px*100, val=(now-s.px)*s.q;
  net+=val; done++;
  dc.textContent=(pct>0?"+":"")+nf(pct,1)+"%"; dc.className="n mono diff "+(pct>0?"neg":"pos");
  tc.textContent=(val>0?"+":"")+nf(val,0); tc.className="n mono tot "+(val>0?"neg":"pos");
 });
 const out=document.getElementById("soldbody").parentElement.parentElement;
 let box=document.getElementById("soldsum");
 if(!box){box=document.createElement("div");box.id="soldsum";out.insertAdjacentElement("afterend",box);}
 box.innerHTML=done?`<div class="blk ${net>0?'n':'p'}"><div class="h">What selling cost or saved you, on ${done} of 6 positions</div>
  ${net>0?`Those positions are worth <b>${nf(net,0)}</b> more than where you sold. Selling cost you that much — <b>so far</b>. That is not a verdict; six weeks is not a horizon.`
  :`Those positions are worth <b>${nf(Math.abs(net),0)}</b> less than where you sold. Selling saved you that much so far.`}
  <br><br><b>Read this as a rule test, not a scoreboard.</b> The question is not whether you got the price right — it is whether the reason you gave still looks correct.</div>`:"";
}

 const f1=parseFloat(document.getElementById("f1").value)||1;

 const fxEff=(f0/f1-1)*100;

 o.innerHTML=`<div class="grid g3" style="margin-bottom:8px">

function calcCeil(){
 const c=parseFloat(document.getElementById("ceil").value)||25;
 const o=document.getElementById("ceilout");
 const tot=REM4.reduce((a,h)=>a+h.val,0);
 const rows=REM4.map(h=>{const w=h.val/tot*100, over=w>c, target=tot*c/100, sell=over?h.val-target:0;
  return {tk:h.tk,w:w,over:over,sell:sell};});
 const totalSell=rows.reduce((a,r)=>a+r.sell,0);
 o.innerHTML=`<div class="tw"><table><thead><tr><th>Ticker</th><th class="n">Weight now</th><th class="n">Ceiling</th><th class="n">To sell</th><th>Action</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td><b>${r.tk}</b></td><td class="n mono ${r.over?'neg':''}">${nf(r.w,1)}%</td>
  <td class="n mono mu">${nf(c,0)}%</td><td class="n mono ${r.over?'neg':'mu'}">${r.over?eur(r.sell):"—"}</td>
  <td>${r.over?'<span class="tag st neg">TRIM</span>':'<span class="tag st pos">WITHIN</span>'}</td></tr>`).join("")}
 </tbody></table></div>
 <div class="blk ${totalSell>0?'n':'p'}"><div class="h">Reading</div>
 ${totalSell>0?`A ceiling of ${nf(c,0)}% would require selling about <b>${eur(totalSell)}</b> today, across ${rows.filter(r=>r.over).length} position${rows.filter(r=>r.over).length>1?'s':''}.
 <b>Notice that this has nothing to do with whether you like those companies.</b> That is the entire point — the decision is arithmetic, taken in advance, and it removes the argument you would otherwise have with yourself.`
 :`Nothing exceeds a ceiling of ${nf(c,0)}%. Set it lower to see where the first constraint would bite.`}</div>`;
}
